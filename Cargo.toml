[package]
name = "bcrypt-rust"
version = "0.1.0"
edition = "2024"
# Pinned by ONE thing: `stdarch_x86_avx512` (AVX-512 intrinsics + the `avx512f`
# target feature) stabilized in Rust 1.89. Nothing else here needs newer.
# Raise it only with a reason, and update the CI `msrv` job in the same commit.
rust-version = "1.89"
description = "Pure-Rust bcrypt with runtime-dispatched SIMD backends for batch hashing"
license = "MIT"
repository = "https://github.com/Brooooooklyn/bcrypt-rust"
homepage = "https://github.com/Brooooooklyn/bcrypt-rust"
documentation = "https://docs.rs/bcrypt-rust"
readme = "README.md"
# tests/ and benches/ ship in the package: their targets are declared in the
# manifest, so excluding the files makes `cargo package` warn about every one
# of them. In the packaged crate the path-only self dev-dependency is
# stripped, so `internal-api` is off and its consumers cfg-gate themselves
# out (`__internal` uses in tests/, and `tests/differential.rs` with it).
exclude = ["/.github", "/fuzz", "/crypt_blowfish", "/docs"]
keywords = ["bcrypt", "password-hash", "simd", "crypto", "blowfish"]
categories = ["cryptography", "no-std"]
# Bench targets are declared explicitly as they land; `benches/support/` is a
# module they `#[path]`-include, not a bench of its own.
autobenches = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# The library target is `bcrypt_rust` (dashes become underscores).
# Tests and benches use `use bcrypt_rust::...`.

[features]
default = ["std", "zeroize"]

# Enables runtime CPU feature detection (needs `std::arch::is_*_feature_detected!`).
# Without it, backend selection falls back to compile-time `target_feature` cfgs.
# Also enables OS-entropy salt generation (`hash`, `hash_many`, …).
std = ["alloc"]

# String-returning APIs (`hash`, `verify`, PHC-style formatting). Without it,
# only the raw byte-oriented API is available.
alloc = []

# Securely wipe internal buffers that hold key material (lane states, padded
# password buffers) with a compiler fence that survives `-O3`.
zeroize = []

# Split batches of at least 2 x available_parallelism items across
# `std::thread::scope` workers, chunked on lane-group boundaries. Off by
# default: a throughput knob for large batches only — single-hash latency is
# untouched, output is byte-identical to the sequential loop, and below the
# threshold the sequential loop still runs. `src/core.rs` documents the
# threshold; the `batch` group in `benches/bcrypt.rs` measures it.
parallel = ["std"]

# Exposes `bcrypt_rust::__internal` so tests/benches can drive individual
# backends. Not part of the stable API; enabled for dev builds via the
# self-dev-dependency below.
internal-api = []

[dependencies]
# None. OS entropy is hand-declared per platform (`src/random.rs`), the
# constant-time compare and secure wipe are hand-rolled, and the bcrypt base64
# codec is 60 lines of scalar code — a 23-byte payload could never repay a SIMD
# or external-codec dependency.

[dev-dependencies]
# Self-dev-dependency: makes `cargo test` / `cargo bench` build the lib with
# `internal-api` on, without leaking it into a plain `cargo build`.
# `default-features = false` keeps `cargo test --no-default-features` honest.
bcrypt-rust = { path = ".", default-features = false, features = ["internal-api"] }

# Criterion (through rayon) does not build for wasi, and no bench or test
# target runs there anyway — `cargo test --target wasm32-wasip1` covers the
# library and the integration tests, never the benches. The incumbent
# `bcrypt` crate sits in the same gate: only `benches/vs_bcrypt.rs` uses it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bcrypt = "0.19.3"
codspeed-criterion-compat = "5.0.1"
criterion = { version = "0.8", features = ["html_reports"] }

# Publishable criterion benches: single-hash latency, per-backend batch
# throughput, verify. Run them on a quiet, named machine — the module docs in
# `benches/bcrypt.rs` say what each group measures and where numbers may go.
[[bench]]
name = "bcrypt"
harness = false

# Head-to-head against the incumbent `bcrypt` crate: same password, same
# costs, plus the 16-wide batch the incumbent cannot express. Numbers are
# only meaningful with the machine recorded — `benches/vs_bcrypt.rs` module
# docs say what each group measures and how the `parallel` leg is run.
[[bench]]
name = "vs_bcrypt"
harness = false

# The CI regression net, measured by CodSpeed's simulation instrument. Small,
# hermetic and single-threaded on purpose — see the module docs in
# `benches/codspeed.rs` for why it does not simply reuse the suite above.
[[bench]]
name = "codspeed"
harness = false

# Dependency-free kernel-timing harness (`fn main` parses argv itself, hence
# `harness = false`). Drives `__internal::bcrypt_many_with_backend`.
[[bench]]
name = "micro"
harness = false

# Scalar vs SIMD base64 codec — the regression net for the NEON/AVX2/SSSE3
# kernels (the codec is ~0.012% of a cost-4 hash; see the module docs).
[[bench]]
name = "base64"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# `panic` deliberately left at the default: the library must not panic on any
# input reachable through the public API, so `abort` would buy nothing and it
# would break `cargo test`.

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
